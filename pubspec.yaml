name: budgeta
description: Track and manage your MoMo money — auto-read on Android, paste/share on iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.1

  # Local persistence (same shape as the web prototype's localStorage state)
  shared_preferences: ^2.2.3

  # Android: read/listen to incoming SMS (Android only — no-op on iOS)
  telephony: ^0.2.0

  # iOS + Android: receive text shared from the Messages app via the Share Sheet
  receive_sharing_intent: 1.8.0

  # Local notifications: instant "transaction logged" alerts + the scheduled
  # daily cash check-in reminder
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Formatting
  intl: ^0.19.0
  uuid: ^4.4.0

  # Backup & restore
  file_picker: ^10.2.0
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  uses-material-design: true
