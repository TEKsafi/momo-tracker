name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37"
      - run: flutter pub get
      - name: Patch telephony plugin namespace
        run: |
          plugin_gradle="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/telephony-0.2.0/android/build.gradle"
          test -f "$plugin_gradle"
          grep -q "namespace 'com.shounakmulay.telephony'" "$plugin_gradle" || \
            sed -i "/^android {/a\\    namespace 'com.shounakmulay.telephony'" "$plugin_gradle"
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "11"/' "$plugin_gradle"
      - run: flutter analyze lib test
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error