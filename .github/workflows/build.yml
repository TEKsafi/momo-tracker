name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
      - run: flutter pub get
      - name: Patch telephony plugin namespace
        run: |
          sed -i "/android {/a\\    namespace 'com.shounakmulay.telephony'" /home/runner/.pub-cache/hosted/pub.dev/telephony-0.2.0/android/build.gradle
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk